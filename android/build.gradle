allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    afterEvaluate {
        if (plugins.hasPlugin('com.android.library') || plugins.hasPlugin('com.android.application')) {
            android {
                if (namespace == null) {
                    namespace = "com.example.${name.replaceAll('-', '_')}"
                }
                compileSdkVersion 35
                
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            
            tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            
            tasks.configureEach { task ->
                if (task.name.startsWith('process') && task.name.endsWith('Manifest')) {
                    task.doFirst {
                        def manifests = project.fileTree(
                            dir: "${project.projectDir}/src",
                            include: "**/AndroidManifest.xml"
                        )
                        manifests.each { File manifestFile ->
                            if (manifestFile.exists()) {
                                def content = manifestFile.text
                                if (content.contains('package="')) {
                                    content = content.replaceAll(/package="[^"]*"/, '')
                                    manifestFile.text = content
                                    logger.lifecycle("Patched package attribute from ${manifestFile.path}")
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
