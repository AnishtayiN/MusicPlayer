{
  "name": "sonic_wave",
  "productName": "SonicWave",
  "version": "1.0.0",
  "description": "SonicWave music player by Anish TayiN",
  "author": "AnishtayiN",
  "private": true,
  "main": "electron/main.js",
  "scripts": {
    "build:win": "electron-builder --win --publish never"
  },
  "build": {
    "appId": "com.example.sonicwave",
    "productName": "SonicWave",
    "directories": {
      "output": "dist_electron",
      "buildResources": "build"
    },
    "files": [
      "electron/**/*",
      "build/web/**/*",
      "package.json"
    ],
    "win": {
      "target": [
        {
          "target": "nsis",
          "arch": ["ia32"]
        }
      ]
    },
    "nsis": {
      "oneClick": false,
      "perMachine": false,
      "allowToChangeInstallationDirectory": true,
      "createDesktopShortcut": true,
      "createStartMenuShortcut": true,
      "shortcutName": "SonicWave",
      "deleteAppDataOnUninstall": false,
      "artifactName": "SonicWaveSetup.exe"
    }
  },
  "devDependencies": {
    "electron": "22.3.27",
    "electron-builder": "24.13.3"
  }
}
