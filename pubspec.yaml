name: sonic_wave
description: SonicWave music player for Android and Windows 7.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  audio_service: ^0.18.15
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.13
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  hive_flutter: ^1.1.0
  http: ^1.2.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  dio: ^5.5.0+1
  palette_generator: ^0.3.3+4
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
